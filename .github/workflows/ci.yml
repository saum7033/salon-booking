name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: Saumya@70
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create databases
        run: |
          PGPASSWORD=Saumya@70 psql -h localhost -U postgres -c "CREATE DATABASE \"booking-db\";"
          PGPASSWORD=Saumya@70 psql -h localhost -U postgres -c "CREATE DATABASE \"salon-db\";"
          PGPASSWORD=Saumya@70 psql -h localhost -U postgres -c "CREATE DATABASE \"payment-db\";"
          PGPASSWORD=Saumya@70 psql -h localhost -U postgres -c "CREATE DATABASE \"services-db\";"
          PGPASSWORD=Saumya@70 psql -h localhost -U postgres -c "CREATE DATABASE microservices;"

      - name: Build booking-service
        run: mvn -f booking-service/pom.xml clean install

      - name: Build category-service
        run: mvn -f category-service/pom.xml clean verify

      - name: Build eureka-server
        run: mvn -f eureka-server/pom.xml clean verify

      - name: Build gateway-server
        run: mvn -f gateway-server/pom.xml clean verify

      - name: Build payment
        run: mvn -f payment/pom.xml clean verify

      - name: Build salon-service
        run: mvn -f salon-service/pom.xml clean verify

      - name: Build service-offering
        run: mvn -f service-offering/pom.xml clean verify

      - name: Build user-service
        run: mvn -f user-service/pom.xml clean verify