name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build booking-service
        run: mvn -f booking-service/pom.xml clean verify

      - name: Build category-service
        run: mvn -f category-service/pom.xml clean verify

      - name: Build eureka-server
        run: mvn -f eureka-server/pom.xml clean verify

      - name: Build gateway-server
        run: mvn -f gateway-server/pom.xml clean verify

      - name: Build payment
        run: mvn -f payment/pom.xml clean verify

      - name: Build salon-service
        run: mvn -f salon-service/pom.xml clean verify

      - name: Build service-offering
        run: mvn -f service-offering/pom.xml clean verify

      - name: Build user-service
        run: mvn -f user-service/pom.xml clean verify