server:
  port: 8088

spring:
  application:
    name: gateway-server

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false

    security:
      oauth2:
        resource server:
          jwt:
            jwk-set-uri: "http://localhost:8080/realms/master/protocol/openid-connect/certs"



      routes:
        - id: booking-service-route
          uri: http://bookingservice:8083
          predicates:
            - Path=/api/bookings/**

        - id: category-service-route
          uri: http://categoryservice:8082
          predicates:
            - Path=/api/category/**

        - id: payment-service-route
          uri: http://paymentservice:8084
          predicates:
            - Path=/api/payments/**

        - id: salon-service-route
          uri: http://salonservice:8080
          predicates:
            - Path=/api/salon/**

        - id: service-offering-route
          uri: http://serviceoffering:8085
          predicates:
            - Path=/api/service-offering/**

        - id: user-service-route
          uri: http://userservice:8086
          predicates:
            - Path=/api/user/**

        - id: notification-service-route
          uri: http://notification:5007
          predicates:
            - Path=/api/notifications/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: "http://localhost:8070/eureka/"
